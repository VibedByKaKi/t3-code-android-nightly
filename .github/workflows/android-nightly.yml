name: Android Nightly

on:
  schedule:
    # Four checks per hour (off :00 to reduce GitHub schedule drops).
    # Builds only when upstream apps/mobile moved.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: android-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync main from upstream
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      synced: ${{ steps.sync.outputs.synced }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      short_sha: ${{ steps.sync.outputs.short_sha }}
      previous_sha: ${{ steps.sync.outputs.previous_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream main into origin/main
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null || git remote set-url upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main || true

          upstream_sha="$(git rev-parse upstream/main)"
          short_sha="$(git rev-parse --short=12 upstream/main)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            main_sha="$(git rev-parse origin/main)"
          else
            main_sha=""
          fi

          # GITHUB_TOKEN cannot create/update workflow files. Mirror upstream
          # content onto main while pinning origin's .github/workflows so the
          # push never touches workflows, even when upstream changes them.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          synced=false
          needs_mirror=false
          if [ -z "$main_sha" ]; then
            needs_mirror=true
          elif git diff --name-only "$main_sha" "$upstream_sha" | grep -v '^\.github/workflows/' | grep -q .; then
            needs_mirror=true
          else
            echo "origin/main already mirrors upstream app content ($short_sha)"
          fi

          if [ "$needs_mirror" = true ]; then
            if [ -n "$main_sha" ]; then
              git checkout -B mirror/main "$main_sha"
            else
              git checkout -B mirror/main "$upstream_sha"
            fi
            git read-tree -um "$upstream_sha"
            if [ -n "$main_sha" ] && git cat-file -e "$main_sha:.github/workflows" 2>/dev/null; then
              git checkout "$main_sha" -- .github/workflows
              while IFS= read -r -d '' path; do
                if ! git cat-file -e "$main_sha:$path" 2>/dev/null; then
                  git rm -f --ignore-unmatch -- "$path" || true
                fi
              done < <(git ls-files -z -- .github/workflows)
            else
              git rm -rf --ignore-unmatch .github/workflows || true
            fi

            if git diff --cached --quiet && git diff --quiet; then
              echo "Mirror tree already matches desired state for $short_sha"
            else
              git commit -m "chore(mirror): sync upstream ${short_sha}"
            fi

            tip_sha="$(git rev-parse HEAD)"
            if [ "$tip_sha" = "$main_sha" ]; then
              echo "No new mirror commit to push"
            else
              # Single commit on top of origin/main: app content from upstream,
              # workflows unchanged vs origin, so GITHUB_TOKEN can push it.
              git push origin "HEAD:refs/heads/main"
              synced=true
              echo "Updated origin/main to mirror of $short_sha (tip $tip_sha)"
            fi
          fi
          echo "synced=$synced" >> "$GITHUB_OUTPUT"

          previous_sha=""
          last_tag="$(
            gh release list --repo "${{ github.repository }}" --limit 100 \
              --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease)][0].tagName // empty'
          )"
          if [[ "$last_tag" == nightly-* ]]; then
            last_short="${last_tag#nightly-}"
            if previous_sha="$(git rev-parse --verify "${last_short}^{commit}" 2>/dev/null)"; then
              echo "Previous nightly: $last_tag ($previous_sha)"
            else
              echo "Could not resolve previous nightly commit '$last_short'"
              previous_sha=""
            fi
          fi
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

          should_build=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; forcing a build"
            should_build=true
          elif [ -z "$last_tag" ]; then
            echo "No prerelease exists yet; forcing a build"
            should_build=true
          elif [[ "$last_tag" != nightly-* ]]; then
            echo "Latest prerelease tag '$last_tag' is not a nightly-*; forcing a build"
            should_build=true
          elif [ -z "$previous_sha" ]; then
            echo "Could not resolve last nightly commit; forcing a build"
            should_build=true
          elif [ "$previous_sha" = "$upstream_sha" ]; then
            echo "Already built upstream tip $short_sha; skipping"
          elif git diff --name-only "$previous_sha" "$upstream_sha" -- apps/mobile | grep -q .; then
            echo "Upstream apps/mobile changed since $last_tag; building"
            git diff --name-only "$previous_sha" "$upstream_sha" -- apps/mobile | head -50
            should_build=true
          else
            echo "No apps/mobile changes since $last_tag; skipping build"
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Cancel inherited upstream workflow runs on main
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pushing upstream commits onto main can enqueue Blacksmith/EAS workflows
          # that do not exist on this fork's default branch. Cancel them and disable
          # any non-nightly workflows that become visible.
          sleep 20
          gh run list --repo "${{ github.repository }}" --branch main --limit 30 \
            --json databaseId,name,status,workflowName \
            --jq '.[] | select(.workflowName != "Android Nightly") | select(.status == "queued" or .status == "in_progress" or .status == "pending") | .databaseId' \
            | while read -r id; do
                echo "Canceling run $id"
                gh run cancel "$id" --repo "${{ github.repository }}" || true
              done
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.path != ".github/workflows/android-nightly.yml") | select(.state == "active") | [.id, .path] | @tsv' \
            | while IFS=$'\t' read -r id wpath; do
                echo "Disabling workflow $wpath ($id)"
                gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable" || true
              done

  build:
    name: Build and publish APK
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_VARIANT: preview
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_NO_GIT_STATUS: "1"
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout nightly CI helpers
        uses: actions/checkout@v5
        with:
          ref: dev
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: .nightly-ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Retarget nightly Android identity
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("apps/mobile/app.config.ts")
          text = path.read_text()
          replacements = [
            ('appName: "T3 Code Preview"', 'appName: "T3 Code Nightly"'),
            ('androidPackage: "com.t3tools.t3code.preview"', 'androidPackage: "com.vibedbykaki.t3code.nightly"'),
            ("scheme: \"t3code-preview\"", "scheme: \"t3code-nightly\""),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f"missing expected snippet: {old}")
            text = text.replace(old, new, 1)
          needle = "updates: {\n    enabled: true,"
          if needle not in text:
            raise SystemExit("missing updates.enabled block")
          text = text.replace(needle, "updates: {\n    enabled: false,", 1)
          path.write_text(text)
          print("Retargeted preview variant for nightly APK builds")
          PY

      - name: Install stable APK signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          mkdir -p "$HOME/.android" "$RUNNER_TEMP/nightly-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/nightly-signing/nightly.keystore"
          # Standard Android debug alias/passwords; keystore itself is our stable nightly key.
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android >/dev/null
          echo "NIGHTLY_KEYSTORE=$RUNNER_TEMP/nightly-signing/nightly.keystore" >> "$GITHUB_ENV"

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --non-interactive

      - name: Configure release signing
        run: python3 .nightly-ci/.github/scripts/configure-nightly-signing.py

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          # Release embeds the JS bundle. Debug only opens the Expo development-client launcher.
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          src="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$src"
          short_sha="${{ needs.sync.outputs.short_sha }}"
          mkdir -p dist
          out="dist/t3-code-nightly-${short_sha}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha="${{ needs.sync.outputs.short_sha }}"
          upstream_sha="${{ needs.sync.outputs.upstream_sha }}"
          previous_sha="${{ needs.sync.outputs.previous_sha }}"
          tag="nightly-${short_sha}"
          title="Nightly ${short_sha}"

          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null \
            || git remote set-url upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

          commits_file="$(mktemp)"
          if [ -n "$previous_sha" ] && [ "$previous_sha" != "$upstream_sha" ]; then
            git log --reverse --pretty=format:'- [%h](https://github.com/pingdotgg/t3code/commit/%H) %s%n' \
              "$previous_sha..$upstream_sha" -- apps/mobile > "$commits_file"
          fi

          if [ ! -s "$commits_file" ]; then
            if [ -z "$previous_sha" ]; then
              printf '%s\n' "- Initial nightly build." > "$commits_file"
            else
              printf '%s\n' "- No new commits touching \`apps/mobile\` since the previous nightly." > "$commits_file"
            fi
          fi

          notes_file="$(mktemp)"
          {
            printf '%s\n' \
              "Unofficial Android nightly of T3 Code." \
              "" \
              "- Upstream commit: [\`${short_sha}\`](https://github.com/pingdotgg/t3code/commit/${upstream_sha})" \
              "- Package: \`com.vibedbykaki.t3code.nightly\`" \
              "- Standalone release APK (not an Expo development client)" \
              "- Built from \`main\` by [Android Nightly](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              "" \
              "## Commits affecting the Android app" \
              ""
            if [ -n "$previous_sha" ]; then
              prev_short="$(git rev-parse --short=12 "$previous_sha")"
              printf '%s\n\n' "Since [\`${prev_short}\`](https://github.com/pingdotgg/t3code/commit/${previous_sha}) (commits touching \`apps/mobile\`):"
            fi
            cat "$commits_file"
          } > "$notes_file"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --repo "${{ github.repository }}" --clobber
            gh release edit "$tag" --repo "${{ github.repository }}" --prerelease --notes-file "$notes_file" --title "$title"
          else
            gh release create "$tag" "${{ steps.apk.outputs.path }}" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "$title" \
              --notes-file "$notes_file"
          fi
